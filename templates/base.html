<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JWC Tecnologia — Portal Corporativo{% endblock %}</title>

  <!-- Bootstrap 5 CSS via CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

  <!-- 1. INCLUSÃO DA NAVBAR VIA PARTIAL -->
  {% include 'partials/_navbar.html' %}

  <!-- 2. BLOCO DE CONTEÚDO DINÂMICO ESPECÍFICO DE CADA TELA -->
  <main class="container my-5">
    {% block content %}
    <!-- O conteúdo de home.html ou produtos.html será renderizado aqui -->
    {% endblock %}
  </main>

  <!-- 3. INCLUSÃO DO RODAPÉ VIA PARTIAL -->
  {% include 'partials/_footer.html' %}

  <!-- Bootstrap 5 JS Bundle via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
